# --- BASICS ---
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster key response
set -sg escape-time 0

# --- TERMINAL ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Extended keys (CSI u) — lets terminal send distinct Ctrl+digit, etc.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'ghostty:extkeys'

# --- SPLITS ---
bind h split-window -h
bind v split-window -v
unbind '"'
unbind %

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- WINDOWS ---
bind c new-window
bind x kill-pane
bind X kill-window
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# Quick window switching
bind -r n next-window
bind -r p previous-window

# Ctrl+number to jump to window N (no prefix)
bind -n C-1 select-window -t :1
bind -n C-2 select-window -t :2
bind -n C-3 select-window -t :3
bind -n C-4 select-window -t :4
bind -n C-5 select-window -t :5
bind -n C-6 select-window -t :6
bind -n C-7 select-window -t :7
bind -n C-8 select-window -t :8
bind -n C-9 select-window -t :9

# --- RELOAD CONFIG ---
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- COPY MODE (vim style) ---
setw -g mode-keys vi

# Smoother wheel scroll — 3 lines per tick instead of 5
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# Stay where you scrolled after mouse-selection (don't jump to bottom)
unbind -T copy-mode-vi MouseDragEnd1Pane
bind   -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"
bind   -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe "wl-copy"
bind   -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe "wl-copy"

# --- AUTO-EXIT COPY MODE ON ANY KEYSTROKE ---
